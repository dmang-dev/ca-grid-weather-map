name = "cagrid-deploy-pinger"
main = "src/worker.js"
compatibility_date = "2026-08-07"

# Cron-only Worker: no HTTP route, no workers.dev subdomain. Wrangler 4 errors
# out unless you say so explicitly, which is what this line is for. The cron
# trigger below is invoked by Cloudflare directly and needs no public URL, and
# registering a workers.dev subdomain is an account-wide decision that would
# expose this (and every later Worker) at a public address for no benefit.
workers_dev = false
# Same reasoning for preview URLs — nothing here should be reachable over HTTP.
# Stating it explicitly also stops Wrangler warning about the default on every
# deploy.
preview_urls = false

# Every 30 minutes. The worker only dispatches when the published snapshot is
# older than MAX_AGE_MINUTES, so a frequent check costs nothing and keeps the
# worst-case staleness near the 2-hour target rather than GitHub's ~3.
[triggers]
crons = ["*/30 * * * *"]

[vars]
REPO = "dmang-dev/ca-grid-weather-map"
WORKFLOW = "deploy-pages.yml"
REF = "main"
MANIFEST_URL = "https://dmang.com/ca-grid-weather-map/data/manifest.json"
# Slightly under 2h: the deploy takes a few minutes, so this triggers the next
# rebuild just before the snapshot actually hits the 2-hour mark.
MAX_AGE_MINUTES = "110"

# GITHUB_TOKEN is a secret, never a var — set it with:
#   npx wrangler secret put GITHUB_TOKEN
