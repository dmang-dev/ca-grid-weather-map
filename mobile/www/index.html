<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CA Grid Weather Map</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0e13; color: #e8eaed;
      font: 15px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 24px; text-align: center; box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 0 0 8px; color: #9ad7ff; }
    p  { margin: 6px 0; opacity: 0.9; max-width: 32em; }
    .muted { opacity: 0.6; font-size: 13px; }
  </style>
</head>
<body>
  <!--
    Fallback shell shown only if the WebView fails to reach the live URL
    (https://dmang-dev.github.io/ca-grid-weather-map/) configured in
    capacitor.config.json. On a working network connection this page is
    never rendered.
  -->
  <main class="wrap">
    <h1>California Grid Weather Map</h1>
    <p>Loading live data from the GitHub Pages snapshot&hellip;</p>
    <p class="muted">If this screen sticks, check your network connection. The app needs
       a network on first launch to load Leaflet, CDN libraries, and the
       data snapshot. Subsequent launches can use the cached snapshot.</p>
  </main>
</body>
</html>
