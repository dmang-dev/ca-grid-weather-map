name: Cross-platform install check

# Verifies that requirements install and fetch_data.py runs to completion
# on Ubuntu, macOS, and Windows. Read-only — never commits anything.
# Triggers on every push to main and on pull requests.

on:
  push:
    branches: [main]
    paths:
      - 'fetch_data.py'
      - 'serve.py'
      - 'app.py'
      - 'requirements.txt'
      - 'requirements-desktop.txt'
      - '.github/workflows/cross-platform-check.yml'
  pull_request:
    paths:
      - 'fetch_data.py'
      - 'serve.py'
      - 'app.py'
      - 'requirements.txt'
      - 'requirements-desktop.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-fetch:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Force UTF-8 for every Python invocation in the job. Required on Windows
    # because Herbie's first-import banner contains Unicode box-drawing chars
    # that crash on the default cp1252 stdout encoding. Harmless on macOS/Linux.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false       # show all three platforms even if one breaks
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print versions
        run: |
          python --version
          pip --version
          python -c "import cfgrib, eccodes, xarray, numpy, shapely, herbie; print('cfgrib', cfgrib.__version__); print('eccodes', eccodes.__version__); print('xarray', xarray.__version__); print('numpy', numpy.__version__); print('shapely', shapely.__version__); print('herbie', herbie.__version__)"

      - name: Run fetch_data.py
        run: python fetch_data.py

      - name: Assert every fetcher succeeded
        shell: python
        run: |
          import json, sys, pathlib
          m = json.loads(pathlib.Path("data/manifest.json").read_text())
          required = ("wind", "outages", "psps", "alerts", "territory",
                      "counties", "fires", "inciweb")
          failures = [k for k in required if m.get(k, {}).get("status") != "ok"]
          if failures:
              print(f"FAIL: fetchers did not return status=ok: {failures}")
              print(json.dumps(m, indent=2))
              sys.exit(1)
          print(f"All {len(required)} fetchers ok.")

      # Desktop deps. We don't launch a window on CI — runners have no display
      # by default — but we verify pywebview and app.py import cleanly. That
      # catches missing wheels, broken syntax, and platform-specific install
      # regressions before they hit a user.
      - name: Install desktop-app deps
        run: pip install -r requirements-desktop.txt

      - name: Import-check app.py and pywebview
        shell: python
        run: |
          import os, sys
          # `shell: python` runs the script from a temp dir, so sys.path[0]
          # is that temp dir — not the repo. Add the repo root (which the
          # runner sets as CWD) before importing local modules.
          sys.path.insert(0, os.getcwd())
          import webview, app
          print(f"webview package imported OK on {sys.platform}; module file: {webview.__file__}")
          for fn in ("ensure_data", "find_free_port", "start_server",
                     "open_window", "main"):
              assert callable(getattr(app, fn)), fn
          print("app.py exports OK")
