name: Build and deploy site

# Replaces refresh-data.yml. That workflow committed a regenerated data/ back
# to main every two hours, which put ~1.3 GB of blobs a year into git history
# (the repo was already at 459 MB / 576 data commits). This regenerates data/
# straight into the Pages artifact instead, so nothing regenerable is stored in
# history at all — the deployed site is still refreshed on the same cadence.

on:
  push:
    branches: [main]
  schedule:
    # Every 2 hours, deliberately NOT on the hour. GitHub delays or silently
    # drops scheduled runs at peak times and :00 is the worst of them — the
    # first two ticks after this workflow was created never fired at all.
    # An odd minute gets picked up far more reliably.
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a slow HRRR run overlap the next tick, and never cancel a deploy
# half-way — a partial Pages deploy is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Gives fetch_data.py a previous snapshot to fall back on. Without it a
      # failing fetcher drops its layer from the site entirely rather than
      # serving the last good copy as "cached" — see the script's docstring.
      # Best-effort: never fails the build, and a cold start just fetches
      # everything from upstream.
      - name: Seed data/ from the published site
        env:
          SITE: https://dmang.com/ca-grid-weather-map/data
        run: python .github/scripts/seed_data.py

      - name: Fetch all data sources
        env:
          PYTHONUTF8: "1"
        run: python fetch_data.py

      # fetch_data.py exits non-zero only when EVERY fetcher dies, so a single
      # broken layer deploys green and silently — which is how one removed CEC
      # field kept utility territories off the map for four days. Annotate
      # rather than fail: a partial outage should still publish the layers that
      # work, but it should not look like a clean run.
      - name: Show manifest and flag degraded layers
        shell: python
        run: |
          import json, pathlib
          m = json.loads(pathlib.Path("data/manifest.json").read_text())
          print(json.dumps(m, indent=2))
          layers = {k: v for k, v in m.items() if isinstance(v, dict)}
          bad = {k: v for k, v in layers.items() if v.get("status") != "ok"}
          for name, entry in bad.items():
              detail = str(entry.get("error") or "")[:180]
              print(f"::warning title=Layer {name} is {entry.get('status')}::{detail}")
          # Problems a fetcher survived but shouldn't hide, such as alerts it
          # had no zone shape for: the layer reads ok, so say it here. Lists
          # only — evacuations' "warnings" is a count of Evacuation Warnings.
          noted = {k: v["warnings"] for k, v in layers.items()
                   if isinstance(v.get("warnings"), list) and v["warnings"]}
          for name, texts in noted.items():
              for text in texts:
                  print(f"::warning title=Layer {name}::{str(text)[:180]}")
          also = f"; {len(noted)} with warnings: {', '.join(sorted(noted))}" if noted else ""
          if bad:
              print(f"::warning title=Degraded deploy::"
                    f"{len(bad)} of {len(layers)} layers not ok: {', '.join(sorted(bad))}{also}")
          else:
              print(f"All {len(layers)} layers ok{also}.")

      # No actions/configure-pages step on purpose. It exists to hand a base
      # path to static site generators, and nothing here reads its outputs —
      # Pages is already enabled with build_type=workflow, so it enabled
      # nothing either. Every action in a job is a tarball fetched from
      # codeload during "Set up job", and that download 429s under load: it
      # took out the 14:49 and 16:00 runs on 2026-08-17 before checkout even
      # started. One less action is one less thing to rate-limit.

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
