name: Refresh demo data

# Keeps the GitHub Pages snapshot fresh. The frontend warns "stale data"
# above 3h since manifest.generated_at — 2h cadence stays well inside that.
# Each run: install deps, fetch all sources, commit data/ if anything changed.

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, on the hour, UTC
  workflow_dispatch:         # run on demand from the Actions tab

# A long-running fetch (slow HRRR day) shouldn't overlap with the next tick.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write             # required to push the data/ commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch all data sources
        env:
          PYTHONUTF8: "1"
        run: python fetch_data.py

      - name: Show manifest
        run: |
          if [ -f data/manifest.json ]; then
            python -c "import json,sys; print(json.dumps(json.load(open('data/manifest.json')), indent=2))"
          fi

      - name: Detect changes in data/
        id: diff
        run: |
          if git diff --quiet data/; then
            echo "No data changes; skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Data changed:"
            git diff --stat data/ | head -20
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="chore: refresh demo data snapshot ($(date -u +'%Y-%m-%d %H:%MZ'))"
          git add data/
          git commit -m "$msg"
          git push
